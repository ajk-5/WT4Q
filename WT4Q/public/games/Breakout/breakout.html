<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Block Breaker — WT4Q Arcade</title>
    <style>
      :root {
        --bg: #070913;
        --panel: #151a2e;
        --text: #e6e8ee;
        --muted: #9aa1b3;
        --accent: #00e7ff;
        --hot: #ff2fb2;
        --coin: #ffe600;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at 18% 18%, rgba(0, 231, 255, 0.15), transparent 52%),
          radial-gradient(circle at 84% 12%, rgba(255, 47, 178, 0.14), transparent 56%),
          radial-gradient(circle at 40% 88%, rgba(255, 230, 0, 0.1), transparent 60%),
          linear-gradient(180deg, #080a15, #050611);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        width: 1100px;
        max-width: 96vw;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: 240px;
      }
      .brand h1 {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 18px;
        margin: 0;
        font-weight: 900;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
      .stats {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .pill {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(21, 26, 46, 0.8);
        color: var(--text);
        font-weight: 800;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        letter-spacing: 0.02em;
        font-size: 12px;
      }
      .btn {
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        background: var(--coin);
        color: #120b1f;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(255, 230, 0, 0.18);
        transition: 0.15s transform, 0.15s filter;
      }
      .btn.secondary {
        background: #232a4a;
        color: #dce0ef;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:hover {
        filter: brightness(1.06);
      }
      .layout {
        display: flex;
        justify-content: center;
      }
      .screen {
        position: relative;
        width: 820px;
        max-width: 100%;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 16px 44px rgba(0, 0, 0, 0.35);
        background: #050611;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 820/560;
        background: radial-gradient(circle at 50% 30%, rgba(0, 231, 255, 0.08), transparent 60%),
          radial-gradient(circle at 30% 70%, rgba(255, 47, 178, 0.07), transparent 56%),
          linear-gradient(180deg, #070913, #040510);
        touch-action: none;
      }
      .scan {
        pointer-events: none;
        position: absolute;
        inset: 0;
        opacity: 0.14;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.06) 0 1px,
          transparent 1px 3px
        );
        mix-blend-mode: overlay;
      }
      .scan::after {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.06;
        background-image: repeating-linear-gradient(
          90deg,
          rgba(255, 230, 0, 0.16) 0 2px,
          transparent 2px 14px
        );
        mix-blend-mode: screen;
      }
      .status {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        margin: 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 230, 0, 0.12);
        color: rgba(230, 232, 238, 0.95);
        box-shadow: inset 0 0 0 1px rgba(255, 230, 0, 0.22);
        font-size: 12px;
        backdrop-filter: blur(6px);
        pointer-events: none;
      }

      @media (max-width: 980px) {
        .screen {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .scan {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7h7v4H4V7Z" fill="rgba(255,47,178,.9)" />
            <path d="M13 7h7v4h-7V7Z" fill="rgba(0,231,255,.95)" />
            <path d="M8 13h8v4H8v-4Z" fill="rgba(255,230,0,.95)" />
          </svg>
          <h1>Block Breaker</h1>
        </div>
        <div class="stats">
          <div class="pill">Score: <span id="score">0</span></div>
          <div class="pill">High: <span id="high">0</span></div>
          <div class="pill">Lives: <span id="lives">3</span></div>
          <div class="pill">Level: <span id="level">1</span></div>
          <button id="serve" class="btn">Serve</button>
          <button id="pause" class="btn secondary">Pause</button>
          <button id="restart" class="btn secondary">Restart</button>
          <button id="sound" class="btn secondary" aria-pressed="true">Sound: ON</button>
        </div>
      </header>

      <div class="layout">
        <div class="screen" aria-label="Block Breaker game screen">
          <canvas id="game" width="820" height="560"></canvas>
          <div class="scan" aria-hidden="true"></div>
          <div id="status" class="status">Tip: press Serve (or Enter).</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d', { alpha: false });

        const scoreEl = document.getElementById('score');
        const highEl = document.getElementById('high');
        const livesEl = document.getElementById('lives');
        const levelEl = document.getElementById('level');
        const statusEl = document.getElementById('status');

        const serveBtn = document.getElementById('serve');
        const pauseBtn = document.getElementById('pause');
        const restartBtn = document.getElementById('restart');
        const soundBtn = document.getElementById('sound');

        const W = canvas.width;
        const H = canvas.height;
        const BORDER = 10;

        const LS_HIGH = 'wt4q_arcade_breakout_high';
        const LS_SOUND = 'wt4q_arcade_breakout_sound';

        let soundOn = (localStorage.getItem(LS_SOUND) ?? 'on') !== 'off';
        soundBtn.setAttribute('aria-pressed', String(soundOn));
        soundBtn.textContent = 'Sound: ' + (soundOn ? 'ON' : 'OFF');

        function loadHigh() {
          const v = Number(localStorage.getItem(LS_HIGH) || 0);
          return Number.isFinite(v) ? v : 0;
        }
        function saveHigh(v) {
          try {
            localStorage.setItem(LS_HIGH, String(v));
          } catch {}
        }

        let audioCtx = null;
        function ensureAudio() {
          if (!soundOn) return;
          if (audioCtx) return;
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch {}
        }
        function beep(freq, dur, type, vol) {
          if (!soundOn) return;
          ensureAudio();
          if (!audioCtx) return;
          const t0 = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || 'square';
          osc.frequency.setValueAtTime(freq || 440, t0);
          gain.gain.setValueAtTime(vol ?? 0.03, t0);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.05));
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + (dur || 0.05));
        }

        function clamp(v, min, max) {
          return Math.max(min, Math.min(max, v));
        }

        const paddle = { w: 124, h: 14, x: W / 2 - 62, y: H - 44, vx: 0 };
        const ball = { x: W / 2, y: H - 70, vx: 0, vy: 0, r: 7 };
        let ballSpeed = 420;

        const bricks = [];
        const BRICK_ROWS = 6;
        const BRICK_COLS = 10;
        const BRICK_GAP = 8;
        const BRICK_TOP = 64;
        const BRICK_H = 22;

        let score = 0;
        let high = loadHigh();
        let lives = 3;
        let level = 1;

        let running = false;
        let paused = false;
        let inPlay = false;
        let gameOver = false;

        let keys = { left: false, right: false };

        function setStatus(text) {
          statusEl.textContent = text;
        }

        function resetBallPaddle() {
          paddle.x = W / 2 - paddle.w / 2;
          ball.x = W / 2;
          ball.y = paddle.y - 22;
          ball.vx = 0;
          ball.vy = 0;
          inPlay = false;
          serveBtn.textContent = 'Serve';
        }

        function buildBricks() {
          bricks.length = 0;
          const usableW = W - BORDER * 2;
          const brickW = Math.floor((usableW - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS);
          const offsetX = BORDER + Math.floor((usableW - (brickW * BRICK_COLS + BRICK_GAP * (BRICK_COLS - 1))) / 2);
          for (let r = 0; r < BRICK_ROWS; r++) {
            for (let c = 0; c < BRICK_COLS; c++) {
              bricks.push({
                x: offsetX + c * (brickW + BRICK_GAP),
                y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
                w: brickW,
                h: BRICK_H,
                alive: true,
                row: r,
              });
            }
          }
        }

        function resetGame() {
          score = 0;
          lives = 3;
          level = 1;
          ballSpeed = 420;
          paused = false;
          gameOver = false;
          inPlay = false;
          pauseBtn.textContent = 'Pause';
          scoreEl.textContent = '0';
          livesEl.textContent = String(lives);
          levelEl.textContent = String(level);
          highEl.textContent = String(high);
          setStatus('Tip: press Serve (or Enter).');
          buildBricks();
          resetBallPaddle();
        }

        function serve() {
          ensureAudio();
          if (!running) {
            running = true;
            last = performance.now();
            raf = requestAnimationFrame(loop);
          }
          if (gameOver) {
            resetGame();
          }
          if (paused) togglePause();
          if (inPlay) return;
          inPlay = true;
          serveBtn.textContent = 'In play';
          const angle = (Math.random() * 0.7 - 0.35) * Math.PI;
          ball.vx = ballSpeed * Math.sin(angle);
          ball.vy = -ballSpeed * Math.cos(angle);
          beep(740, 0.05, 'square', 0.03);
        }

        function togglePause() {
          if (!running || gameOver) return;
          paused = !paused;
          pauseBtn.textContent = paused ? 'Resume' : 'Pause';
          setStatus(paused ? 'Paused — press Space to resume.' : 'Back in motion.');
          beep(paused ? 220 : 440, 0.05, 'square', 0.02);
        }

        function restart() {
          ensureAudio();
          if (!running) {
            running = true;
            last = performance.now();
            raf = requestAnimationFrame(loop);
          }
          resetGame();
          beep(520, 0.05, 'square', 0.03);
        }

        function loseLife() {
          lives -= 1;
          livesEl.textContent = String(lives);
          beep(140, 0.12, 'sawtooth', 0.03);
          if (lives <= 0) {
            gameOver = true;
            inPlay = false;
            serveBtn.textContent = 'Serve';
            setStatus('Game over — hit Restart to try again.');
          } else {
            inPlay = false;
            resetBallPaddle();
            setStatus('Oof! Hit Serve to continue.');
          }
        }

        function maybeNextLevel() {
          for (let i = 0; i < bricks.length; i++) {
            if (bricks[i].alive) return false;
          }
          level += 1;
          levelEl.textContent = String(level);
          ballSpeed = Math.min(420 + (level - 1) * 40, 720);
          buildBricks();
          resetBallPaddle();
          setStatus('Level up! Hit Serve to start.');
          beep(880, 0.07, 'square', 0.03);
          beep(660, 0.07, 'square', 0.03);
          return true;
        }

        function update(dt) {
          // Paddle controls
          const paddleSpeed = 640;
          paddle.vx = (keys.left ? -paddleSpeed : 0) + (keys.right ? paddleSpeed : 0);
          paddle.x = clamp(paddle.x + paddle.vx * dt, BORDER, W - BORDER - paddle.w);

          if (!inPlay) {
            // Stick ball to paddle
            ball.x = clamp(ball.x + paddle.vx * dt, BORDER + ball.r, W - BORDER - ball.r);
            ball.y = paddle.y - 22;
            return;
          }

          const prevX = ball.x;
          const prevY = ball.y;
          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;

          // Walls
          if (ball.x - ball.r <= BORDER) {
            ball.x = BORDER + ball.r;
            ball.vx *= -1;
            beep(320, 0.03, 'square', 0.02);
          } else if (ball.x + ball.r >= W - BORDER) {
            ball.x = W - BORDER - ball.r;
            ball.vx *= -1;
            beep(320, 0.03, 'square', 0.02);
          }
          if (ball.y - ball.r <= BORDER) {
            ball.y = BORDER + ball.r;
            ball.vy *= -1;
            beep(320, 0.03, 'square', 0.02);
          }

          // Paddle collision
          if (
            ball.y + ball.r >= paddle.y &&
            ball.y - ball.r <= paddle.y + paddle.h &&
            ball.x + ball.r >= paddle.x &&
            ball.x - ball.r <= paddle.x + paddle.w &&
            ball.vy > 0
          ) {
            const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
            const angle = clamp(rel, -1, 1) * 0.9;
            const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.01, 820);
            ball.vx = speed * Math.sin(angle);
            ball.vy = -Math.abs(speed * Math.cos(angle));
            ball.y = paddle.y - ball.r - 0.5;
            beep(520 + Math.abs(rel) * 320, 0.04, 'square', 0.03);
          }

          // Brick collisions
          for (let i = 0; i < bricks.length; i++) {
            const b = bricks[i];
            if (!b.alive) continue;
            if (
              ball.x + ball.r < b.x ||
              ball.x - ball.r > b.x + b.w ||
              ball.y + ball.r < b.y ||
              ball.y - ball.r > b.y + b.h
            )
              continue;

            // Hit!
            b.alive = false;
            score += 10;
            scoreEl.textContent = String(score);
            if (score > high) {
              high = score;
              highEl.textContent = String(high);
              saveHigh(high);
            }
            beep(740 - b.row * 40, 0.04, 'square', 0.03);

            // Bounce direction (approx)
            const cameFromTop = prevY + ball.r <= b.y;
            const cameFromBottom = prevY - ball.r >= b.y + b.h;
            const cameFromLeft = prevX + ball.r <= b.x;
            const cameFromRight = prevX - ball.r >= b.x + b.w;
            if (cameFromTop || cameFromBottom) ball.vy *= -1;
            else if (cameFromLeft || cameFromRight) ball.vx *= -1;
            else ball.vy *= -1;

            break;
          }

          // Fell below
          if (ball.y - ball.r > H + 10) {
            loseLife();
          }

          if (!gameOver) maybeNextLevel();
        }

        function draw() {
          ctx.fillStyle = '#070913';
          ctx.fillRect(0, 0, W, H);

          // Border
          ctx.save();
          ctx.strokeStyle = 'rgba(255,255,255,0.10)';
          ctx.lineWidth = 3;
          ctx.strokeRect(BORDER + 0.5, BORDER + 0.5, W - BORDER * 2 - 1, H - BORDER * 2 - 1);
          ctx.restore();

          // Faint score watermark
          ctx.save();
          ctx.fillStyle = 'rgba(255,255,255,0.10)';
          ctx.font = '900 78px ui-monospace, Menlo, Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.fillText(String(score), W / 2, H / 2);
          ctx.restore();

          // Bricks
          for (let i = 0; i < bricks.length; i++) {
            const b = bricks[i];
            if (!b.alive) continue;
            const hue = 200 + b.row * 18;
            const fill = `hsla(${hue}, 95%, 60%, 0.92)`;
            ctx.save();
            ctx.shadowColor = fill;
            ctx.shadowBlur = 18;
            ctx.fillStyle = fill;
            roundRect(ctx, b.x, b.y, b.w, b.h, 10);
            ctx.fill();
            ctx.restore();
          }

          // Paddle
          ctx.save();
          ctx.shadowColor = 'rgba(0,231,255,0.9)';
          ctx.shadowBlur = 22;
          ctx.fillStyle = 'rgba(0,231,255,0.9)';
          roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 10);
          ctx.fill();
          ctx.restore();

          // Ball
          ctx.save();
          ctx.shadowColor = 'rgba(255,230,0,0.9)';
          ctx.shadowBlur = 18;
          ctx.fillStyle = 'rgba(255,230,0,0.95)';
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (!running) overlay('PRESS SERVE', 'Enter to launch the ball');
          else if (gameOver) overlay('GAME OVER', 'Press Restart to try again');
          else if (paused) overlay('PAUSED', 'Press Space to resume');
          else if (!inPlay) overlay('READY', 'Press Serve to continue');
        }

        function overlay(title, subtitle) {
          ctx.save();
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = 'rgba(255,255,255,0.95)';
          ctx.textAlign = 'center';
          ctx.font = '900 44px ui-monospace, Menlo, Consolas, monospace';
          ctx.fillText(title, W / 2, H / 2 - 12);
          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          ctx.font = '700 16px ui-monospace, Menlo, Consolas, monospace';
          ctx.fillText(subtitle, W / 2, H / 2 + 18);
          ctx.restore();
        }

        function roundRect(c, x, y, w, h, r) {
          const rr = Math.min(r, w / 2, h / 2);
          c.beginPath();
          c.moveTo(x + rr, y);
          c.arcTo(x + w, y, x + w, y + h, rr);
          c.arcTo(x + w, y + h, x, y + h, rr);
          c.arcTo(x, y + h, x, y, rr);
          c.arcTo(x, y, x + w, y, rr);
          c.closePath();
        }

        let raf = 0;
        let last = performance.now();
        function loop(t) {
          const dt = Math.min(0.05, (t - last) / 1000);
          last = t;
          if (running && !paused && !gameOver) update(dt);
          draw();
          raf = requestAnimationFrame(loop);
        }

        // Input: keyboard
        window.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
          if (e.key === ' ') {
            e.preventDefault();
            togglePause();
          }
          if (e.key === 'Enter') serve();
          if (e.key === 'r' || e.key === 'R') restart();
        });
        window.addEventListener('keyup', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        // Input: touch/mouse drag
        function canvasPosX(ev) {
          const rect = canvas.getBoundingClientRect();
          return (ev.clientX - rect.left) * (canvas.width / rect.width);
        }
        let dragging = false;
        canvas.addEventListener('pointerdown', (e) => {
          ensureAudio();
          dragging = true;
          const x = canvasPosX(e);
          paddle.x = clamp(x - paddle.w / 2, BORDER, W - BORDER - paddle.w);
        });
        canvas.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          const x = canvasPosX(e);
          paddle.x = clamp(x - paddle.w / 2, BORDER, W - BORDER - paddle.w);
        });
        window.addEventListener('pointerup', () => {
          dragging = false;
        });

        // Buttons
        serveBtn.addEventListener('click', serve);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', restart);
        soundBtn.addEventListener('click', () => {
          soundOn = !soundOn;
          soundBtn.setAttribute('aria-pressed', String(soundOn));
          soundBtn.textContent = 'Sound: ' + (soundOn ? 'ON' : 'OFF');
          try {
            localStorage.setItem(LS_SOUND, soundOn ? 'on' : 'off');
          } catch {}
          if (!soundOn && audioCtx) {
            try {
              audioCtx.close();
            } catch {}
            audioCtx = null;
          } else {
            ensureAudio();
            beep(520, 0.05, 'square', 0.02);
          }
        });

        // Boot
        highEl.textContent = String(high);
        resetGame();
        draw();
        setStatus('Press Serve (or Enter) to begin.');
      })();
    </script>
  </body>
</html>
